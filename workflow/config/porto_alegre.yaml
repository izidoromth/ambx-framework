city: porto_alegre
location: "Porto Alegre, Rio Grande do Sul, Brazil"
grid_format: hexagon
cell_size: 200
poi_buffer: 2000
network_type: walk
walk_speed_kph: 5.0
max_snap_distance: 1000
k_nearest: 3
n_jobs: 8
output_dir: results/porto_alegre

scenarios:
  typical: {}

  inundacao:
    penalties:
      - name: inundacao
        function: porto_alegre_inundacao
        layer: inundacao_cprm
        input: data/raw/porto_alegre/inundacao_cprm.geojson
        input_type: vector
        value_field: classe
        aggregation: mean

  movimento_massa:
    penalties:
      - name: movimento_massa
        function: porto_alegre_movimento_massa
        layer: movimento_massa_cprm
        input: data/raw/porto_alegre/movimento_massa_cprm.geojson
        input_type: vector
        value_field: classe
        aggregation: mean

  combinado:
    penalties:
      - name: inundacao
        function: porto_alegre_inundacao
        layer: inundacao_cprm
        input: data/raw/porto_alegre/inundacao_cprm.geojson
        input_type: vector
        value_field: classe
        aggregation: mean
      - name: movimento_massa
        function: porto_alegre_movimento_massa
        layer: movimento_massa_cprm
        input: data/raw/porto_alegre/movimento_massa_cprm.geojson
        input_type: vector
        value_field: classe
        aggregation: mean
