city: curitiba
location: "Curitiba, Parana, Brazil"
grid_format: hexagon
cell_size: 200
poi_buffer: 2000
network_type: walk
walk_speed_kph: 5.0
max_snap_distance: 200
k_nearest: 3
n_jobs: 8
output_dir: results/curitiba

scenarios:
  typical: {}
  lst:
    penalties:
      - name: lst
        function: curitiba_lst
        layer: LST_Anual_2026_220078_Mediana
        input: data/raw/curitiba/LST_Anual_2026_220078_Mediana.tif
        input_type: raster
  # Regra composta: lê LST e vegetação no mesmo ponto amostrado e devolve o
  # fator térmico multiplicado pela redução do sombreamento. Duas regras
  # simples não funcionariam na amostragem por segmentos, onde cada regra
  # amostraria em posições diferentes da mesma aresta.
  lst_green_composite:
    penalties:
      - name: lst_green
        function: curitiba_lst_green
        input_type: composite
        layers: [lst, area_verde]
        sampling: segments
        n_samples: 4
        aggregation: mean
        inputs:
          lst:
            name: lst
            input: data/raw/curitiba/LST_Anual_2026_220078_Mediana.tif
            input_type: raster
          area_verde:
            name: area_verde
            input: data/processed/curitiba/area_verde_2019.tif
            input_type: raster

  # --- Demonstrativo: k = 0,05, ~7x a calibração. Existe para evidenciar a
  # resposta da lib a um gradiente térmico severo. Não é resultado.
  lst_demo_k05:
    penalties:
      - name: lst
        function: curitiba_lst_demo
        layer: LST_Anual_2026_220078_Mediana
        input: data/raw/curitiba/LST_Anual_2026_220078_Mediana.tif
        input_type: raster
  lst_green_composite_demo_k05:
    penalties:
      - name: lst_green
        function: curitiba_lst_green_demo
        input_type: composite
        layers: [lst, area_verde]
        sampling: segments
        n_samples: 4
        aggregation: mean
        inputs:
          lst:
            name: lst
            input: data/raw/curitiba/LST_Anual_2026_220078_Mediana.tif
            input_type: raster
          area_verde:
            name: area_verde
            input: data/processed/curitiba/area_verde_2019.tif
            input_type: raster
